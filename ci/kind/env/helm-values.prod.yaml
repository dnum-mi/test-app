ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
  - example.domain.local

server:
  image: 
    repository: test-app/server
    tag: prod
    pullPolicy: Never
    pullSecret: null

client:
  image: 
    repository: test-app/client
    tag: prod
    pullPolicy: Never
    pullSecret: null
  env:
    VITE_SERVER_HOST: http://example.domain.local
