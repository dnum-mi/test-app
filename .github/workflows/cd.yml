name: CD

on:
  push:
    branches:
    - develop
    - main
  workflow_dispatch:

# Releases must never overlap: two pushes landing close together would run two
# release jobs against the same branch, and the loser fails on the tag the
# winner already created ("Duplicate release tag"). Queue instead of cancel -
# aborting a release midway is worse than making it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_AMD64: true
  BUILD_ARM64: false
  LATEST_TAG: ${{ github.ref_name == 'main' }}
  USE_QEMU: true
  TAG_MAJOR_AND_MINOR: false
  AUTOMERGE_PRERELEASE: true
  AUTOMERGE_RELEASE: false
  # 'auto' needs 'Allow auto-merge' in Settings > General, which private repos
  # on the free plan can't enable. 'admin' merges immediately instead.
  AUTOMERGE_METHOD: admin
  PRERELEASE_BRANCH: develop
  RELEASE_BRANCH: main
  RELEASE_CONFIG_FILE: release-please-config.json
  RELEASE_MANIFEST_FILE: .release-please-manifest.json
  PRERELEASE_CONFIG_FILE: release-please-config-rc.json
  PRERELEASE_MANIFEST_FILE: .release-please-manifest-rc.json
  ENABLE_PRERELEASE: true

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      BUILD_AMD64: ${{ env.BUILD_AMD64 }}
      BUILD_ARM64: ${{ env.BUILD_ARM64 }}
      LATEST_TAG: ${{ env.LATEST_TAG }}
      USE_QEMU: ${{ env.USE_QEMU }}
      TAG_MAJOR_AND_MINOR: ${{ env.TAG_MAJOR_AND_MINOR }}
      AUTOMERGE_PRERELEASE: ${{ env.AUTOMERGE_PRERELEASE }}
      AUTOMERGE_RELEASE: ${{ env.AUTOMERGE_RELEASE }}
      AUTOMERGE_METHOD: ${{ env.AUTOMERGE_METHOD }}
      PRERELEASE_BRANCH: ${{ env.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE: ${{ env.RELEASE_CONFIG_FILE }}
      RELEASE_MANIFEST_FILE: ${{ env.RELEASE_MANIFEST_FILE }}
      PRERELEASE_CONFIG_FILE: ${{ env.PRERELEASE_CONFIG_FILE }}
      PRERELEASE_MANIFEST_FILE: ${{ env.PRERELEASE_MANIFEST_FILE }}
      ENABLE_PRERELEASE: ${{ env.ENABLE_PRERELEASE }}
    steps:
    - name: Exposing env vars
      run: echo "Exposing env vars"

  release:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-app.yml@v0
    needs:
    - expose-vars
    permissions:
      issues: write
      pull-requests: write
      contents: write
    with:
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      AUTOMERGE_METHOD: ${{ needs.expose-vars.outputs.AUTOMERGE_METHOD }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.RELEASE_CONFIG_FILE }}
      RELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.RELEASE_MANIFEST_FILE }}
      PRERELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_CONFIG_FILE }}
      PRERELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_MANIFEST_FILE }}
      ENABLE_PRERELEASE: ${{ needs.expose-vars.outputs.ENABLE_PRERELEASE == 'true' }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  build-docker:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        service:
        - name: server
          context: ./apps/server
          dockerfile: ./apps/server/Dockerfile
        - name: client
          context: ./apps/client
          dockerfile: ./apps/client/Dockerfile
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository}}/${{ matrix.service.name }}
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ${{ matrix.service.context }}
      IMAGE_DOCKERFILE: ${{ matrix.service.dockerfile }}
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' && needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      BUILD_ARGS: |
        APP_VERSION=${{ needs.release.outputs.version }}
    # No `secrets:` block: pushing to ghcr.io authenticates with the job's own
    # GITHUB_TOKEN, and BUILD_SECRET_GITHUB_TOKEN is left at its 'none' default,
    # so nothing here needs a credential. `secrets: inherit` would hand this
    # workflow every secret in the repository - SONAR_TOKEN, GIT_MIRROR_TOKEN,
    # APP_PRIVATE_KEY - to build a container that uses none of them.

  bump-chart-local:
    uses: dnum-mi/fabnum-cicd/.github/workflows/update-helm-chart.yml@v0
    needs:
    - expose-vars
    - release
    - build-docker
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      pull-requests: write
      contents: write
    with:
      RUN_MODE: local
      CHART_DIR: ./
      CHART_NAME: helm
      # UPGRADE_TYPE defaults to 'auto': level from the appVersion delta, rc
      # cycle vs release selected by the shape of APP_VERSION
      APP_VERSION: ${{ needs.release.outputs.version }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      AUTOMERGE_METHOD: ${{ needs.expose-vars.outputs.AUTOMERGE_METHOD }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  bump-chart-remote:
    uses: dnum-mi/fabnum-cicd/.github/workflows/dispatch-helm-chart.yml@v0
    needs:
    - expose-vars
    - release
    - build-docker
    if: ${{ needs.release.outputs.release-created == 'true' }}
    # Authenticated entirely by the App token, scoped to test-helm alone.
    permissions: {}
    with:
      WORKFLOW_NAME: update-chart.yml
      CHART_REPO: dnum-mi/test-helm
      CHART_DIR: ./charts
      CHART_NAME: test-app
      # UPGRADE_TYPE defaults to 'auto': level from the appVersion delta, rc
      # cycle vs release selected by the shape of APP_VERSION
      APP_VERSION: ${{ needs.release.outputs.version }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      AUTOMERGE_METHOD: ${{ needs.expose-vars.outputs.AUTOMERGE_METHOD }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  release-charts:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-helm-local.yml@v0
    permissions:
      contents: read
      packages: write
    needs:
    - expose-vars
    - release
    - build-docker
    - bump-chart-local
    with:
      # Monorepo: the chart shares the app's tag namespace, so chart-releaser's
      # tag-based change detection is unreliable - package the exact version
      # bumped by bump-chart-local instead.
      CHARTS_DIR: ./
      CHART_NAME: helm
      CHART_VERSION: ${{ needs.bump-chart-local.outputs.chart-version }}
      APP_VERSION: ${{ needs.release.outputs.version }}
      CHECKOUT_REF: ${{ needs.bump-chart-local.outputs.commit-sha }}
      HELM_REPOS: "bitnami=https://charts.bitnami.com/bitnami,hashicorp=https://helm.releases.hashicorp.com,cnpg=https://cloudnative-pg.github.io/charts"

  # Last on purpose. A release lands commits on main that develop does not have
  # - release-please's release commit, and bump-chart-local's chart bump - and
  # develop edits those same files on its own rc cycle. Left unsynchronised it
  # computes its next versions from a pre-release state and conflicts with main
  # on the following promotion.
  #
  # `needs:` lists exactly the jobs that COMMIT to main - release and
  # bump-chart-local - and nothing else. build-docker and release-charts commit
  # nothing, and listing them would only let a failed build or a failed publish
  # skip the sync, leaving develop stale for no reason. Ordering still holds:
  # bump-chart-local already needs build-docker.
  #
  # release-app.yml asserts the result on the next develop run, so a missing
  # entry here fails loudly there rather than silently producing a version
  # below what main published.
  sync-prerelease-branch:
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-prerelease-branch.yml@v0
    needs:
    - expose-vars
    - release
    - bump-chart-local
    if: ${{ github.ref_name == needs.expose-vars.outputs.RELEASE_BRANCH && needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: write
    with:
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}

  sync-cpin:
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-cpin.yml@v0
    needs:
    - expose-vars
    - release
    - build-docker
    - bump-chart-local
    - bump-chart-remote
    - release-charts
    if: ${{ needs.release.outputs.release-created == 'true' }}
    # Posts to the GitLab mirror API and touches nothing on GitHub.
    permissions: {}
    with:
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      GIT_MIRROR_PROJECT_ID: ${{ vars.GIT_MIRROR_PROJECT_ID }}
      BRANCH_TO_SYNC: ${{ format('v{0}', needs.release.outputs.version) }}
      REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME }}
    secrets:
      GIT_MIRROR_TOKEN: ${{ secrets.GIT_MIRROR_TOKEN }}
