# Keeps the resource names (test-app-server, ...) the same whichever name the
# chart is published under: the copy pushed to Harbor is named test-app-mono.
nameOverride: test-app

global:
  ingress:
    enabled: true
    annotations: {}
    labels: {}

server:
  env:
    API_PORT: "8080"

client:
  envFrom:
  - secretRef:
      name: test-app-vso
